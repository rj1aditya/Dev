<!-- Simple CAD-style SVG floor plan (scale: 1 ft = 20 px) -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>25x50 First Floor Plan (West Facing)</title>
  </head>
  <body>
    <!-- Simple CAD-style SVG floor plan (scale: 1 ft = 20 px) -->
    <!doctype html>
    <html>
      <head>
        <meta charset="utf-8" />
        <title>
          25x50 First Floor Plan (West Facing, Separate Kitchen & Hall)
        </title>
      </head>
      <body>
        <svg
          width="1000"
          height="700"
          viewBox="0 0 1000 700"
          xmlns="http://www.w3.org/2000/svg"
        >
          <style>
            .wall {
              fill: none;
              stroke: #000;
              stroke-width: 4;
            }
            .room {
              fill: none;
              stroke: #333;
              stroke-width: 2;
            }
            .label {
              font: 14px Arial;
              fill: #000;
            }
            .dim {
              font: 12px Arial;
              fill: #555;
            }
          </style>

          <!-- Plot boundary: 25 ft x 50 ft (1 ft = 20 px => 500 x 1000 px) -->
          <g transform="translate(50,50)">
            <rect x="0" y="0" width="500" height="1000" class="wall" />

            <!-- West (Front) is left side -->

            <!-- Stair Lobby (Front-Right, L-shaped stair footprint zone) -->
            <rect x="350" y="0" width="150" height="220" class="room" />
            <text x="360" y="25" class="label">Stair Lobby (L-shape)</text>

            <!-- Kitchen (Front-Left, Separate) -->
            <!-- Kitchen ~ 10x10 ft => 200x200 px -->
            <rect x="0" y="0" width="200" height="200" class="room" />
            <text x="20" y="25" class="label">Kitchen (10’×10’)</text>

            <!-- Living/Hall (Middle-Front, Separate) -->
            <!-- Hall ~ 14x16 ft => 280x320 px -->
            <rect x="200" y="220" width="280" height="320" class="room" />
            <text x="235" y="260" class="label">Living / Hall (14’×16’)</text>

            <!-- Store (Near Kitchen) -->
            <!-- Store ~ 5x6 ft => 100x120 px -->
            <rect x="0" y="220" width="100" height="120" class="room" />
            <text x="10" y="245" class="label">Store (5’×6’)</text>

            <!-- Bedroom 1 (Rear-Left) 12x14 ft => 240x280 px -->
            <rect x="0" y="600" width="240" height="280" class="room" />
            <text x="20" y="630" class="label">Bedroom 1 (12’×14’)</text>

            <!-- Toilet 1 (Attached) 5x7 ft => 100x140 px -->
            <rect x="240" y="600" width="100" height="140" class="room" />
            <text x="245" y="625" class="label">Toilet (5’×7’)</text>

            <!-- Bedroom 2 (Rear-Right) 12x14 ft => 240x280 px -->
            <rect x="260" y="600" width="240" height="280" class="room" />
            <text x="280" y="630" class="label">Bedroom 2 (12’×14’)</text>

            <!-- Toilet 2 (Attached) 5x7 ft => 100x140 px -->
            <rect x="350" y="600" width="100" height="140" class="room" />
            <text x="355" y="625" class="label">Toilet (5’×7’)</text>

            <!-- Circulation / Passage -->
            <rect x="100" y="220" width="100" height="260" class="room" />
            <text x="110" y="255" class="label">Passage</text>

            <!-- Orientation labels -->
            <text x="200" y="-10" class="dim">West (Front)</text>
            <text x="200" y="1020" class="dim">East (Rear)</text>
            <text x="520" y="520" class="dim" transform="rotate(90 520,520)">
              50 ft
            </text>
            <text x="220" y="1040" class="dim">25 ft</text>
          </g>
        </svg>
      </body>
    </html>
  </body>
</html>
